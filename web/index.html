<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>右键长按联动器</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="frame">
  <aside class="sidebar">
    <div class="brand" id="brand">
      <img id="brandIcon" src="assets/icon.png" alt="">
      <div class="brandText">
        <b>RMBCK</b>
        <span id="brandVer">v2.1.0</span>
      </div>
    </div>
    <nav id="nav">
      <button class="navBtn active" data-page="overview" aria-label="概览"><i aria-hidden="true">◈</i>概览</button>
      <button class="navBtn" data-page="keys" aria-label="按键"><i aria-hidden="true">⌨</i>按键</button>
      <button class="navBtn" data-page="process" aria-label="进程"><i aria-hidden="true">◉</i>进程</button>
      <button class="navBtn" data-page="history" aria-label="日志"><i aria-hidden="true">≡</i>日志</button>
      <button class="navBtn" data-page="settings" aria-label="设置"><i aria-hidden="true">⚙</i>设置</button>
    </nav>
    <div class="sideFoot">
      <span id="statusChip" class="chip off" aria-live="polite">已禁用</span>
    </div>
  </aside>

  <main class="content">
    <header class="titlebar" id="titlebar">
      <div class="tbSpace"></div>
      <button class="winBtn" id="btnTheme" title="切换主题" aria-label="切换主题"><span aria-hidden="true">◐</span></button>
      <button class="winBtn" id="btnMin" title="最小化到托盘" aria-label="最小化到托盘"><span aria-hidden="true">—</span></button>
      <button class="winBtn close" id="btnClose" title="关闭" aria-label="关闭"><span aria-hidden="true">✕</span></button>
    </header>

    <section class="page active" id="page-overview"><div class="placeholder">（此页将在后续版本填充）</div></section>
    <section class="page" id="page-keys"><div class="placeholder">（此页将在后续版本填充）</div></section>
    <section class="page" id="page-process"><div class="placeholder">（此页将在后续版本填充）</div></section>
    <section class="page" id="page-history"><div class="placeholder">（此页将在后续版本填充）</div></section>
    <section class="page" id="page-settings"><div class="placeholder">（此页将在后续版本填充）</div></section>
  </main>
</div>

<div class="modalWrap" id="modalWrap"></div>
<div class="toasts" id="toasts"></div>
<button class="secretDot" id="secretDot" type="button" aria-label=""
   title=""></button>
<script src="app.js"></script>
</body>
</html>
